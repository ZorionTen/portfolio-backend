projects:
  - name: portfolio
    environments:
      - name: production
        services:
          - type: web
            runtime: docker
            name: portfolio-backend
            repo: https://github.com/ZorionTen/portfolio-backend
            plan: free
            region: singapore
            autoDeployTrigger: checksPass
            healthCheckPath: /actuator/health
          - type: web
            runtime: docker
            name: portfolio-ai
            repo: https://github.com/ZorionTen/portfolio-ai
            plan: free
            region: singapore
            autoDeployTrigger: checksPass
            healthCheckPath: /health
            envVars:
              - key: GROQ_API_KEY
                sync: false
